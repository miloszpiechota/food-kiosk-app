<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1250" viewBox="0 0 1900 1250">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#263746"/>
  </marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#B33B43"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.13"/>
  </filter>
  <style>
    .title { font-family: Inter, Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #10283F; }
    .subtitle { font-family: Inter, Arial, sans-serif; font-size: 28px; font-weight: 600; fill: #40556A; }
    .state-name { font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #142536; }
    .state-desc { font-family: Inter, Arial, sans-serif; font-size: 14px; fill: #314252; }
    .terminal { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #5A6670; }
    .edge-label { font-family: Inter, Arial, sans-serif; font-size: 15px; fill: #243746; }
    .note-title { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #534300; }
    .note { font-family: Inter, Arial, sans-serif; font-size: 14px; fill: #4C420D; }
    .tech { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #18324A; }
  </style>
</defs>
<rect x="0" y="0" width="1900" height="1250" fill="#FFFFFF"/>

<text x="950" y="60" text-anchor="middle" class="title">Order Lifecycle</text>
<text x="950" y="103" text-anchor="middle" class="subtitle">State Diagram</text>
<circle cx="90" cy="312" r="13" fill="#1F2933"/>
<line x1="103" y1="312" x2="252" y2="312" stroke="#263746" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="170" y="298" text-anchor="middle" class="edge-label">Order created</text>
<text x="90" y="350" text-anchor="middle" class="terminal">Start</text>
<rect x="260" y="250" width="260" height="125" rx="18" fill="#F1F3F5" stroke="#7A8288" stroke-width="2.4" filter="url(#shadow)"/>
<text x="390.0" y="284" text-anchor="middle" class="state-name">NEW</text>
<text x="390.0" y="313" text-anchor="middle" class="state-desc">Order was created and is waiting</text>
<text x="390.0" y="334" text-anchor="middle" class="state-desc">for restaurant processing.</text>
<rect x="640" y="250" width="280" height="125" rx="18" fill="#E8F3FF" stroke="#357ABD" stroke-width="2.4" filter="url(#shadow)"/>
<text x="780.0" y="284" text-anchor="middle" class="state-name">IN_PROGRESS</text>
<text x="780.0" y="313" text-anchor="middle" class="state-desc">Restaurant staff accepted the order</text>
<text x="780.0" y="334" text-anchor="middle" class="state-desc">and started preparing it.</text>
<rect x="1040" y="250" width="260" height="125" rx="18" fill="#FFF4D6" stroke="#C78A00" stroke-width="2.4" filter="url(#shadow)"/>
<text x="1170.0" y="284" text-anchor="middle" class="state-name">READY</text>
<text x="1170.0" y="313" text-anchor="middle" class="state-desc">The order has been prepared and</text>
<text x="1170.0" y="334" text-anchor="middle" class="state-desc">is ready for collection.</text>
<rect x="1420" y="250" width="300" height="125" rx="18" fill="#E7F7EC" stroke="#2D8A4E" stroke-width="2.4" filter="url(#shadow)"/>
<text x="1570.0" y="284" text-anchor="middle" class="state-name">COMPLETED</text>
<text x="1570.0" y="313" text-anchor="middle" class="state-desc">The paid order was collected or</text>
<text x="1570.0" y="334" text-anchor="middle" class="state-desc">successfully fulfilled.</text>
<text x="1570.0" y="355" text-anchor="middle" class="terminal">Terminal state</text>
<rect x="840" y="615" width="300" height="125" rx="18" fill="#FDEBEC" stroke="#C63B45" stroke-width="2.4" filter="url(#shadow)"/>
<text x="990.0" y="649" text-anchor="middle" class="state-name">CANCELLED</text>
<text x="990.0" y="678" text-anchor="middle" class="state-desc">The order was cancelled before completion.</text>
<text x="990.0" y="699" text-anchor="middle" class="terminal">Terminal state</text>
<line x1="520" y1="312.5" x2="630" y2="312.5" stroke="#263746" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="580.0" y="286.5" text-anchor="middle" class="edge-label">Admin starts preparation</text>
<line x1="920" y1="312.5" x2="1030" y2="312.5" stroke="#263746" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="980.0" y="286.5" text-anchor="middle" class="edge-label">Preparation finished</text>
<line x1="1300" y1="312.5" x2="1410" y2="312.5" stroke="#263746" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1360.0" y="286.5" text-anchor="middle" class="edge-label">Admin completes order</text>
<text x="1360.0" y="305.5" text-anchor="middle" class="edge-label">[paymentStatus = PAID]</text>
<path d="M 390.0 375 V 505 H 900 V 605" fill="none" stroke="#B33B43" stroke-width="2" marker-end="url(#arrowRed)"/>
<text x="645.0" y="492" text-anchor="middle" class="edge-label" fill="#8B2F36">Admin cancels order</text>
<path d="M 780.0 375 V 505 H 990 V 605" fill="none" stroke="#B33B43" stroke-width="2" marker-end="url(#arrowRed)"/>
<text x="885.0" y="492" text-anchor="middle" class="edge-label" fill="#8B2F36">Admin cancels order</text>
<path d="M 1170.0 375 V 505 H 1080 V 605" fill="none" stroke="#B33B43" stroke-width="2" marker-end="url(#arrowRed)"/>
<text x="1125.0" y="492" text-anchor="middle" class="edge-label" fill="#8B2F36">Admin cancels order</text>
<rect x="55" y="820" width="430" height="170" rx="15" fill="#FFF9DE" stroke="#D5C268" stroke-width="1.5"/>
<text x="73" y="850" class="note-title">Separate state machines</text>
<text x="73" y="878" class="note">Order status and payment status are</text>
<text x="73" y="900" class="note">separate state machines.</text>
<text x="73" y="944" class="note">Submitting the current status again</text>
<text x="73" y="966" class="note">makes no change.</text>
<rect x="515" y="820" width="430" height="170" rx="15" fill="#FFF9DE" stroke="#D5C268" stroke-width="1.5"/>
<text x="533" y="850" class="note-title">Completion guard</text>
<text x="533" y="878" class="note">Only PAID orders can transition</text>
<text x="533" y="900" class="note">from READY to COMPLETED.</text>
<text x="533" y="944" class="note">The backend rejects an attempt to</text>
<text x="533" y="966" class="note">complete an unpaid order.</text>
<rect x="975" y="820" width="430" height="170" rx="15" fill="#FFF9DE" stroke="#D5C268" stroke-width="1.5"/>
<text x="993" y="850" class="note-title">Backend enforcement</text>
<text x="993" y="878" class="note">The backend validates every transition.</text>
<text x="993" y="900" class="note">The frontend cannot bypass these rules.</text>
<text x="993" y="944" class="note">Invalid transitions are not shown.</text>
<rect x="1435" y="820" width="430" height="170" rx="15" fill="#FFF9DE" stroke="#D5C268" stroke-width="1.5"/>
<text x="1453" y="850" class="note-title">Authorization</text>
<text x="1453" y="878" class="note">Restaurant Admin can update only orders</text>
<text x="1453" y="900" class="note">belonging to restaurants assigned to</text>
<text x="1453" y="922" class="note">their account.</text>
<rect x="430" y="1040" width="1040" height="145" rx="14" fill="#F3F7FA" stroke="#9EB2C2" stroke-width="1.5"/>
<text x="450" y="1070" class="note-title" fill="#18324A">Endpoint responsible for changes</text>
<text x="450" y="1100" class="tech">PATCH /api/v1/admin/orders/:orderId/status</text>
<text x="450" y="1128" class="tech">{ "status": "IN_PROGRESS" }</text>
<text x="450" y="1158" class="state-desc">Implemented rules: apps/api/src/admin-auth/admin-order.service.ts, line 23</text>
</svg>