<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1320" viewBox="0 0 2200 1320" role="img" aria-labelledby="title desc">
<title id="title">Food Ordering Kiosk Platform — C4 System Context Diagram</title>
<desc id="desc">Clean C4 System Context diagram for the Food Ordering Kiosk Platform.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#31485C"/>
  </marker>
  <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#6557D8"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#10283F" flood-opacity="0.09"/>
  </filter>
  <style>
    .title { font-family: Inter, Arial, sans-serif; font-size: 38px; font-weight: 750; fill:#10283F; }
    .subtitle { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight:650; fill:#66798B; letter-spacing:1px; }
    .section { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight:750; fill:#7B8B98; letter-spacing:1.5px; }
    .name { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight:750; fill:#10283F; }
    .nameInv { font-family: Inter, Arial, sans-serif; font-size: 25px; font-weight:750; fill:#FFFFFF; }
    .type { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight:650; fill:#6D7E8E; }
    .typeInv { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight:650; fill:#D8E5FF; }
    .body { font-family: Inter, Arial, sans-serif; font-size: 14px; fill:#46596A; }
    .bodyInv { font-family: Inter, Arial, sans-serif; font-size: 15px; fill:#EEF3FF; }
    .rel { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight:650; fill:#354A5D; }
    .noteTitle { font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight:750; fill:#1E4747; }
    .note { font-family: Inter, Arial, sans-serif; font-size: 13px; fill:#496262; }
    .legend { font-family: Inter, Arial, sans-serif; font-size: 12px; fill:#667788; }
  </style>
</defs>
<rect width="2200" height="1320" fill="#FBFCFE"/>

<text x="1100" y="55" text-anchor="middle" class="title">Food Ordering Kiosk Platform</text>
<text x="1100" y="84" text-anchor="middle" class="subtitle">C4 SYSTEM CONTEXT DIAGRAM</text>
<text x="250" y="145" class="section">PEOPLE</text>
<text x="1130" y="145" text-anchor="middle" class="section">SYSTEM IN SCOPE</text>
<text x="1910" y="145" text-anchor="middle" class="section">EXTERNAL SYSTEMS</text>
<g filter="url(#shadow)">
<rect x="80" y="185" width="430" height="150" rx="18" fill="#FFFFFF" stroke="#DCE5EC"/>
</g>
<rect x="80" y="185" width="6" height="150" rx="3" fill="#2E63D3"/>
<circle cx="122" cy="226" r="8" fill="none" stroke="#2E63D3" stroke-width="2"/>
<path d="M 107 248 C 110 236, 134 236, 137 248" fill="none" stroke="#2E63D3" stroke-width="2" stroke-linecap="round"/>
<text x="156" y="221" class="name">Kiosk Customer</text>
<text x="156" y="242" class="type">[Person]</text>
<text x="104" y="277" class="body">Browses menus, configures meals, places orders,</text>
<text x="104" y="297" class="body">and completes test payments.</text>
<g filter="url(#shadow)">
<rect x="80" y="420" width="430" height="170" rx="18" fill="#FFFFFF" stroke="#DCE5EC"/>
</g>
<rect x="80" y="420" width="6" height="170" rx="3" fill="#158179"/>
<circle cx="122" cy="461" r="8" fill="none" stroke="#158179" stroke-width="2"/>
<path d="M 107 483 C 110 471, 134 471, 137 483" fill="none" stroke="#158179" stroke-width="2" stroke-linecap="round"/>
<text x="156" y="456" class="name">Restaurant Admin</text>
<text x="156" y="477" class="type">[Person]</text>
<text x="104" y="512" class="body">Manages assigned restaurant orders, payment</text>
<text x="104" y="532" class="body">information, order statuses, and menu visibility.</text>
<g filter="url(#shadow)">
<rect x="80" y="675" width="430" height="150" rx="18" fill="#FFFFFF" stroke="#DCE5EC"/>
</g>
<rect x="80" y="675" width="6" height="150" rx="3" fill="#7A56C2"/>
<circle cx="122" cy="716" r="8" fill="none" stroke="#7A56C2" stroke-width="2"/>
<path d="M 107 738 C 110 726, 134 726, 137 738" fill="none" stroke="#7A56C2" stroke-width="2" stroke-linecap="round"/>
<text x="156" y="711" class="name">Super Admin</text>
<text x="156" y="732" class="type">[Person]</text>
<text x="104" y="767" class="body">Invites administrators and manages</text>
<text x="104" y="787" class="body">company-level operations.</text>
<g filter="url(#shadow)">
<rect x="850" y="285" width="560" height="330" rx="26" fill="#2459C4"/>
</g>
<text x="884" y="337" class="typeInv">[Software System]</text>
<text x="884" y="388" class="nameInv">Food Ordering Kiosk Platform</text>
<text x="884" y="430" class="bodyInv">Provides kiosk ordering, backend pricing, Stripe test payments,</text>
<text x="884" y="455" class="bodyInv">and protected multi-restaurant administration.</text>
<g filter="url(#shadow)">
<rect x="1700" y="185" width="420" height="150" rx="18" fill="#FFFFFF" stroke="#DCE5EC"/>
</g>
<circle cx="1744" cy="229" r="22" fill="#635BFF" opacity=".12"/>
<text x="1744" y="234" text-anchor="middle" style="font-family:Inter,Arial;font-size:15px;font-weight:800;fill:#635BFF">S</text>
<text x="1782" y="220" class="name">Stripe</text>
<text x="1782" y="242" class="type">[Software System]</text>
<text x="1724" y="277" class="body">Hosts test Checkout and sends signed</text>
<text x="1724" y="297" class="body">payment webhooks.</text>
<g filter="url(#shadow)">
<rect x="1700" y="420" width="420" height="140" rx="18" fill="#FFFFFF" stroke="#DCE5EC"/>
</g>
<circle cx="1744" cy="464" r="22" fill="#DF6536" opacity=".12"/>
<text x="1744" y="469" text-anchor="middle" style="font-family:Inter,Arial;font-size:15px;font-weight:800;fill:#DF6536">R</text>
<text x="1782" y="455" class="name">Resend</text>
<text x="1782" y="477" class="type">[Software System]</text>
<text x="1724" y="512" class="body">Delivers administrator invitations and</text>
<text x="1724" y="532" class="body">password-reset emails.</text>
<g filter="url(#shadow)">
<rect x="1700" y="705" width="420" height="160" rx="18" fill="#FFFFFF" stroke="#DCE5EC"/>
</g>
<circle cx="1744" cy="749" r="22" fill="#187B70" opacity=".12"/>
<text x="1744" y="754" text-anchor="middle" style="font-family:Inter,Arial;font-size:15px;font-weight:800;fill:#187B70">2FA</text>
<text x="1782" y="740" class="name">TOTP Authenticator App</text>
<text x="1782" y="762" class="type">[Software System]</text>
<text x="1724" y="797" class="body">Generates six-digit codes for mandatory</text>
<text x="1724" y="817" class="body">admin 2FA.</text>
<path d="M 510 260 H 670 V 350 H 844" fill="none" stroke="#31485C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="680" y="225" text-anchor="middle" class="rel">Browse menus, configure meals,</text>
<text x="680" y="242" text-anchor="middle" class="rel">place orders</text>
<path d="M 510 505 H 670 V 445 H 844" fill="none" stroke="#31485C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="680" y="475" text-anchor="middle" class="rel">Authenticate + manage assigned</text>
<text x="680" y="492" text-anchor="middle" class="rel">restaurant operations</text>
<path d="M 510 750 H 670 V 545 H 844" fill="none" stroke="#31485C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="680" y="720" text-anchor="middle" class="rel">Authenticate + invite admins</text>
<text x="680" y="737" text-anchor="middle" class="rel">and manage platform operations</text>
<path d="M 295 185 V 120 H 1910 V 179" fill="none" stroke="#6557D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)"/>
<text x="1100" y="113" text-anchor="middle" class="rel">Enter test-card details on Stripe-hosted Checkout</text>
<path d="M 1410 345 H 1535 V 260 H 1694" fill="none" stroke="#31485C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1540" y="295" text-anchor="middle" class="rel">Create Checkout Session</text>
<text x="1540" y="312" text-anchor="middle" class="rel">using validated order total</text>
<path d="M 1700 305 H 1585 V 390 H 1416" fill="none" stroke="#6557D8" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)"/>
<text x="1565" y="415" text-anchor="middle" class="rel">Signed payment webhook events</text>
<path d="M 1410 500 H 1694" fill="none" stroke="#31485C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1550" y="475" text-anchor="middle" class="rel">Invitation and password-reset</text>
<text x="1550" y="492" text-anchor="middle" class="rel">email delivery</text>
<rect x="850" y="700" width="560" height="205" rx="20" fill="#EEF7F5" stroke="#C8E2DD"/>
<circle cx="886" cy="734" r="17" fill="#187B70" opacity=".14"/>
<text x="886" y="740" text-anchor="middle" style="font-family:Inter,Arial;font-size:16px;font-weight:800;fill:#187B70">i</text>
<text x="916" y="739" class="noteTitle">Administrator 2FA boundary</text>
<text x="874" y="775" class="note">Mandatory for Restaurant Admin and Super Admin.</text>
<text x="874" y="797" class="note">No network connection exists between the platform and the authenticator app.</text>
<text x="874" y="819" class="note">The QR code transfers the enrollment secret; codes are generated locally.</text>
<text x="874" y="841" class="note">Administrators manually submit TOTP or recovery codes to the platform.</text>
<text x="874" y="863" class="note">Recovery codes are generated and verified by the platform.</text>
<path d="M 295 590 V 985 H 1810 V 871" fill="none" stroke="#158179" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1010" y="977" text-anchor="middle" class="rel">Restaurant Admin: scan enrollment QR + read local TOTP code</text>
<path d="M 295 825 V 1030 H 1910 V 871" fill="none" stroke="#7A56C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1110" y="1022" text-anchor="middle" class="rel">Super Admin: scan enrollment QR + read local TOTP code</text>
<line x1="90" y1="1215" x2="135" y2="1215" stroke="#31485C" stroke-width="2" marker-end="url(#arrow)"/>
<text x="150" y="1220" class="legend">Direct interaction / request</text>
<line x1="390" y1="1215" x2="435" y2="1215" stroke="#6557D8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowPurple)"/>
<text x="450" y="1220" class="legend">Webhook / callback</text>
<text x="2110" y="1220" text-anchor="end" class="legend">Same system context • simplified relationship labels for readability</text>
</svg>